<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="base" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2a2a30" />
      <stop offset="55%" stop-color="#141416" />
      <stop offset="100%" stop-color="#050506" />
    </radialGradient>
    <radialGradient id="spot2" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spot3" cx="82%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="crowd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)" />
  <rect width="1600" height="1000" fill="url(#spot2)" />
  <rect width="1600" height="1000" fill="url(#spot3)" />

  <g opacity="0.4" filter="url(#soft)">
    <polygon points="800,0 640,1000 720,1000" fill="#ffffff" opacity="0.04" />
    <polygon points="800,0 880,1000 960,1000" fill="#ffffff" opacity="0.03" />
    <polygon points="800,0 380,1000 500,1000" fill="#ffffff" opacity="0.03" />
    <polygon points="800,0 1100,1000 1220,1000" fill="#ffffff" opacity="0.03" />
  </g>

  <g fill="#000000" opacity="0.85">
    <ellipse cx="120" cy="960" rx="90" ry="70" />
    <ellipse cx="260" cy="980" rx="100" ry="75" />
    <ellipse cx="410" cy="965" rx="95" ry="72" />
    <ellipse cx="560" cy="985" rx="105" ry="78" />
    <ellipse cx="720" cy="970" rx="98" ry="74" />
    <ellipse cx="880" cy="985" rx="105" ry="78" />
    <ellipse cx="1040" cy="965" rx="95" ry="72" />
    <ellipse cx="1190" cy="980" rx="100" ry="75" />
    <ellipse cx="1340" cy="960" rx="90" ry="70" />
    <ellipse cx="1480" cy="978" rx="95" ry="74" />
  </g>

  <rect width="1600" height="1000" fill="url(#crowd)" />
</svg>
